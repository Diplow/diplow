# The config of the "hexframe app: Import & export" project's autonomous run, read by
# run-autonomous-project (.skills/4-softeng/1-ship/run-autonomous-project/references/contract.md
# holds every key). It gives Mapping Leaves, a Name, Tile config and kept
# Frontmatter, writes a Tile and everything below it as files and as a zip,
# reads a zip or a folder back the way the shape does, and lays the canvas out
# on the shape's layoutView. The app imports the shape from
# 2-claude-mod/hooks/shape/ by relative path, as the Obsidian plugin does, so
# the shape stays writable; every file of claude-mod outside hooks/shape/
# (its top-level files and dot files, .claude-plugin/, tests/, hooks/'s own
# files, hooks/draw/) and the whole plugin are frozen.
# Every caller of the shape outside the app is frozen with them, so a change to
# the shape is additive: its exports keep their names, types and behaviour, and a
# unit that needs to break one parks instead.
# The design is in the "Later" section of 1-app/src/domains/mapping/CLAUDE.md.
# Every ticket lands on project/import-export, which I merge into main at the end:
#
#   /softeng:ship:run-autonomous-project "hexframe app: Import & export" --config 4-software-engineering/1-projects/1-hexframe/.run/import-export.yaml
#
# The run never edits this file.

version: 1
team: Hexframe

repo:
  target_branch: project/import-export
  merge_strategy: merge
  working_tree: shared

parallelism: 1

# The tickets exist, so nothing is minted.
projects:
  - name: "hexframe app: Import & export"
    on_exhausted: park
    mint_tickets: false

# Tiers from .skills/model-tiers.md: judge is the strongest, work the default, fetch the cheapest.
models:
  phase: opus
  unit: opus
  planner: opus
  fixup: opus
  reviewer: opus
  fetch: haiku

# Run from the repo root. The install comes first so a unit that adds a
# dependency proves its lockfile.
gates:
  unit:
    - pnpm --dir 4-software-engineering/1-projects/1-hexframe install --frozen-lockfile
    - pnpm --dir 4-software-engineering/1-projects/1-hexframe check
    - pnpm --dir 4-software-engineering/1-projects/1-hexframe test
  phase:
    - pnpm --dir 4-software-engineering/1-projects/1-hexframe install --frozen-lockfile
    - pnpm --dir 4-software-engineering/1-projects/1-hexframe check
    - pnpm --dir 4-software-engineering/1-projects/1-hexframe test
    - pnpm --dir 4-software-engineering/1-projects/1-hexframe build
  fix_rounds_per_gate: 3

# cubic's three agents (cubic.yaml) rank each finding P0 to P3. The run starts
# them itself through the cubic CLI, which reviews on the Claude Code
# subscription (`cubic auth connect claude-code`) instead of cubic's credits.
# cubic-dev-ai's own review on the pull request needs credits, so the run
# does not wait for it.
reviews:
  automated: []
  local:
    name: cubic
    command: "cubic review --base origin/{target} --json"
  max_rounds: 3
  must_fix: [P0, P1]
  should_fix: [P2]

halting:
  never:
    - Never push to main, open a pull request into main, or merge anything into main.
    - Never weaken a gate to turn it green. No skipped or deleted test, no lowered lint threshold, no rule disabled without a reason, no --no-verify.
    - Never put a secret, a token, a Key or a .env file in a commit, a log, a comment or a pull request. Name the variable, never its value.
    - Never write to a production Neon database, a live Stripe account, or any third-party account outside a test mode or a preview.
    - Never add a beta or alpha dependency outside a seam that STACK.md names.
    - Never import one domain from another, or a third-party SDK from anywhere but its repository; the exceptions are the MCP server's SDK, in the API layer's MCP folder, as STACK.md says, and fflate in the browser, in `src/front/client/mapping/`, which zips an import before its upload.
    - Never exceed the rule of 6; when a folder is full, regroup and record the regrouping in the register.
    - Never touch a ticket, branch or pull request of another project.
  # The repo's own tooling and review setup, hexframe's STACK.md (the bar the
  # never list defers to; what the project changes in it, the phase-close ticket
  # lists for me), claude-mod but its shape, which the app now imports, the
  # Obsidian plugin, and the vault's Obsidian config.
  frozen_paths:
    - .skills/**
    - .claude/**
    - .conductor/**
    - .obsidian/**
    - .gitattributes
    - .mcp.json
    - cubic.yaml
    - 4-software-engineering/1-projects/1-hexframe/.cubic/**
    - 4-software-engineering/1-projects/1-hexframe/STACK.md
    - 4-software-engineering/1-projects/1-hexframe/.run/CLAUDE.md
    - 4-software-engineering/1-projects/1-hexframe/.run/*.yaml
    - 4-software-engineering/1-projects/1-hexframe/2-claude-mod/*
    - 4-software-engineering/1-projects/1-hexframe/2-claude-mod/.*
    - 4-software-engineering/1-projects/1-hexframe/2-claude-mod/.claude-plugin/**
    - 4-software-engineering/1-projects/1-hexframe/2-claude-mod/tests/**
    - 4-software-engineering/1-projects/1-hexframe/2-claude-mod/hooks/*
    - 4-software-engineering/1-projects/1-hexframe/2-claude-mod/hooks/draw/**
    - 4-software-engineering/1-projects/1-hexframe/3-obsidian-plugin/**
  # Everything of mine that is not hexframe.
  read_only_paths:
    - CLAUDE.md
    - STACK.md
    - .gitignore
    - 1-leadership/**
    - 2-education/**
    - 3-games/**
    - 5-startups/**
    - 6-politics/**
    - 4-software-engineering/-CLAUDE.md
    - 4-software-engineering/2-principles/**
    - 4-software-engineering/1-projects/CLAUDE.md
    - 4-software-engineering/1-projects/2-site/**
    - "**/-*"
    - "**/-*/**"

registers:
  dir: 4-software-engineering/1-projects/1-hexframe/.run/registers
  files: [decisions.md]
  # .cubic/security.md: every break of the security bar is fixed, never waived.
  security_bugs: >-
    Nothing lands with a security finding open. When the round cap runs out
    with a valid security finding unresolved, the pull request is not merged:
    the unit is parked whole, kind review-exhausted, with the finding's thread
    URL, or the round comment's URL for a local finding, in its PARK entry.

summary_schema: [status, landed, register_entries, parked, interventions]

linear:
  state_in_progress: In Progress
  state_in_review: In Review
  state_done: Done
