# Configuration de la source — paramètre unique d'entrée
# pour les scripts (Scripts/*.py) et les skills (Skills/*).

source:
  name: "Le Réveilleur"                # nom affiché (commits, logs, docs)
  slug: "lereveilleur"                # préfixe branches git, nom court
  type: "youtube"                        # unique type supporté pour l'instant
  attribution: "Rodolphe Meyer"  # phrase utilisée dans les fiches (ex: "la PaduTeam")
  # Qui mène chaque Publication, même quand le Raw ne dit pas son nom : sa mention passe la
  # vérification sans être entendue.
  hosts: ["Rodolphe Meyer"]

youtube:
  channel_url: "https://www.youtube.com/@lereveilleur/videos"
  channel_handle: "@lereveilleur"
  # Où commence la Chronicle : `wikipol fetch` ne range aucune vidéo publiée avant cette date
  # (AAAA-MM-JJ, sans guillemets), et s'arrête à la troisième de suite. Absent : toute la chaîne.
  # since: 2023-10-31

files:
  inventaire: "Sources/Inventaire.md"
  chronologique: "LEREVEILLEUR_CHRONOLOGIQUE.md"

git:
  repo: "Diplow/diplow"                   # dépôt qui héberge WikiPol (GitHub)
  default_branch: "main"
  ingest_branch_prefix: "ingest-batch/"

claude:
  # L'identifiant épinglé du modèle qui écrit les Digests de la Source, passé tel quel à
  # `claude -p --model` et recopié dans le champ `model` de chaque Digest. Jamais un alias
  # (`sonnet`, `opus`) ni un `-latest` : ils glissent vers un modèle plus récent sans prévenir.
  default_model: claude-sonnet-5-5

# Whitelist stricte des types de fiches activés pour cette source.
# - Les skills write-* refusent d'écrire un type désactivé.
# - Pour activer un type plus tard : passer à `true` ici et créer le dossier
#   à la main (ou via un script utilitaire).
# Voir BUILD.md de WikiPol pour la spec frontmatter de chaque type.
content_types:
  raw:
    Transcripts: true
  basic:
    Individus: true
    Organisations: true
    Concepts: true
    Videos: true
    Livres: false
    Evenements: false
  advanced:
    Enjeux: true
    Conjonctures: false
    Possibles: false
    Methodes: false
