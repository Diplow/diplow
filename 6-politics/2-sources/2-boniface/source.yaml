# Configuration de la source — paramètre unique d'entrée
# pour les scripts (Scripts/*.py) et les skills (Skills/*).

source:
  name: "Boniface"                # nom affiché (commits, logs, docs)
  slug: "boniface"                # préfixe branches git, nom court
  type: "youtube"                        # unique type supporté pour l'instant
  attribution: "Pascal Boniface"  # phrase utilisée dans les fiches (ex: "la PaduTeam")

youtube:
  channel_url: "https://www.youtube.com/@pascalboniface241/videos"
  channel_handle: "@pascalboniface241"

# Le vault Obsidian de la source, figé (WIK-1) : lu en entrée, plus jamais écrit.
# Chemin relatif à ce fichier ; les chemins de `files` se résolvent depuis lui.
legacy:
  vault: "../../1-projects/1-wikipol/Legacy/Boniface"
files:
  inventaire: "Sources/Inventaire.md"
  chronologique: "BONIFACE_CHRONOLOGIQUE.md"

git:
  repo: "Diplow/diplow"
  default_branch: "main"
  ingest_branch_prefix: "ingest-batch/"

claude:
  # L'identifiant épinglé du modèle qui écrit les Digests de la Source, passé tel quel à
  # `claude -p --model` et recopié dans le champ `model` de chaque Digest. Jamais un alias
  # (`sonnet`, `opus`) ni un `-latest` : ils glissent vers un modèle plus récent sans prévenir.
  default_model: claude-sonnet-5-5

# Whitelist stricte des types de fiches activés pour cette source.
# - Scripts/new_source.py scaffolde les dossiers correspondants.
# - Les skills write-* refusent d'écrire un type désactivé.
# - Pour activer un type plus tard : passer à `true` ici et créer le dossier
#   à la main (ou via un script utilitaire).
# Voir BUILD.md de WikiPol pour la spec frontmatter de chaque type.
content_types:
  raw:
    Transcripts: true
  basic:
    Individus: true
    Organisations: true
    Concepts: true
    Videos: true
    Livres: true
    Evenements: false
  advanced:
    Enjeux: true
    Conjonctures: false
    Possibles: false
    Methodes: false
